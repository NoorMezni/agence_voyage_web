<section class="testimonials-section">
  <div class="container">
    <div class="section-header">
      <span class="badge-label">TÉMOIGNAGES</span>
      <h2>Ce que disent nos voyageurs</h2>
      <p>Des avis authentiques de nos clients</p>
    </div>

    <div class="testimonials-grid">
      <div class="testimonial-card" *ngFor="let t of testimonials">
        <div class="stars">
          <span *ngFor="let s of [1,2,3,4,5]" [class.filled]="s <= t.rating">★</span>
        </div>
        <p class="quote">"{{ t.comment }}"</p>
        <div class="author">
          <div class="avatar">{{ t.initials }}</div>
          <div>
            <strong>{{ t.name }}</strong>
            <span>{{ t.destination }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
